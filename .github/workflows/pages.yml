name: Deploy JavaQuest Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack website
        run: |
          rm -rf site unpack
          mkdir -p site
          unzip -q JavaQuest-Web.zip -d unpack
          cp -R unpack/web/. site/
          touch site/.nojekyll
          test -f site/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
